# OpenRFID Type Normaliser — config file
#
# Deploy to: /oem/printer_data/config/extended/openrfid_type_normalizer.cfg
#
# If this file does not exist, only Step 1 (exact match) is active.
# Steps 2 and 3 default to OFF. Cold start required after changes.
#
# Resolution order:
#   Step 1  Exact match against VALID_BASE_MATERIALS       (always active, no config needed)
#   Step 2  [material_type_map] below                      (active when this file exists)
#   Step 3  Strip trailing '+': ABS+ → ABS                (strip_plus = on)
#   Step 4  Longest-prefix match: PETG-RAPID → PETG       (prefix_match = on)

[material_type_normalizer]
strip_plus   = on
prefix_match = on

# Explicit type mapping — checked before algorithmic steps (Step 0).
# Keys are matched case-insensitively. Values must be in VALID_BASE_MATERIALS.
# Use this section to override the algorithm for specific types.
#
# Examples:
#   ABS-PLUS = ABS
#   SILK-PLA = PLA

[material_type_map]
