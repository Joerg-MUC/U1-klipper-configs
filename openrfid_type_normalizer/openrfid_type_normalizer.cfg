# OpenRFID Type Normaliser
# Deploy to: /oem/printer_data/config/extended/openrfid_type_normalizer.cfg
#
# If this file does not exist, only Steps 1 and 2 are active (Step 2 with
# empty map = no-op). Steps 3 and 4 default to off. Cold start required
# after changes.
#
# Resolution order:
#   Step 1  Exact match against VALID_BASE_MATERIALS       always active
#   Step 2  Explicit map (type_map below)                  active when file exists
#   Step 3  Strip trailing '+': ABS+ → ABS                strip_plus: true
#   Step 4  Longest-prefix match: PETG-RAPID → PETG       prefix_match: true

options:
  strip_plus: false    # Step 3
  prefix_match: false  # Step 4

# Step 2 — explicit overrides, checked before algorithmic steps.
# Values must be valid entries from VALID_BASE_MATERIALS.
type_map:
  # ABS-PLUS: ABS
  # SILK-PLA: PLA
