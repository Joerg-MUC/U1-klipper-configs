# OpenRFID Type Normaliser config
# Deploy to: /oem/printer_data/config/extended/openrfid_type_normalizer.cfg
#
# Resolution order:
#   Step 1  Exact match against VALID_BASE_MATERIALS       always active
#   Step 2  Explicit type_map below                        active when file exists
#   Step 3  Strip trailing '+': ABS+ → ABS                strip_plus: true
#   Step 4  Longest-prefix match: PETG-RAPID → PETG       prefix_match: true
#
# Cold start required after changes.

# Strip trailing '+' from filament type before matching (Step 3)
# Options: true, false
strip_plus: false

# Match filament type against longest valid prefix (Step 4)
# Options: true, false
prefix_match: false

# Explicit type mapping, checked before algorithmic steps (Step 2)
# Values must be valid entries from VALID_BASE_MATERIALS
# type_map:
#   ABS-PLUS: ABS
#   SILK-PLA: PLA
type_map:
