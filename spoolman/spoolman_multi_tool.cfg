# Remember the selected spools across printer reboots
[save_variables]
filename: ~/printer_data/config/variables.cfg

[gcode_macro _SPOOLMAN_CFG]
# List of tools to track. Extend if you have more than 4 physical toolheads.
variable_tools: ['T0','T1','T2','T3']
gcode:
  # no g-code, this is just a convenient "array" of tools to iterate over.
  RESPOND PREFIX="🧶" MSG="Nothing to see here"


# ---------------------------------------------------------------------------
# SET_ACTIVE_SPOOL_MAPPED
# ---------------------------------------------------------------------------
# Activates the correct Spoolman spool for a given logical tool index,
# taking the Snapmaker Orca physical extruder mapping into account.
#
# Background: Snapmaker Orca's Print Dialog allows remapping logical slicer
# extruder numbers (G-code T0-T3) to different physical toolheads. For example,
# a single-colour print sliced with Extruder 1 (-> G-code T0) can be mapped
# to physical TH4 in the Print Dialog. The mapping is stored at runtime in
#   printer.print_task_config['extruder_map_table']
# as a 32-element list where extruder_map_table[logical] = physical.
#
# Without this lookup, Spoolman always tracks the *logical* extruder's spool
# instead of the spool physically loaded in the active toolhead.
#
# Fallback: if print_task_config is unavailable (e.g. non-Snapmaker Klipper),
# TOOL_INDEX is used directly -- identical behaviour to the original macro.
#
# Credit: mapping approach originally implemented by
#   gunnypatel (https://github.com/gunnypatel/U1-klipper-configs)
# ---------------------------------------------------------------------------
[gcode_macro SET_ACTIVE_SPOOL_MAPPED]
description: Activates the Spoolman spool for a tool, respecting Snapmaker Orca extruder mapping.
gcode:
  {% if not params.TOOL_INDEX is defined %}
    RESPOND MSG="Error in SET_ACTIVE_SPOOL_MAPPED: Parameter 'TOOL_INDEX' is required."
    return
  {% endif %}

  {% set tool_index = params.TOOL_INDEX|int %}
  {% set map_table_key = 'extruder_map_table' %}

  {% if printer.print_task_config is defined and map_table_key in printer.print_task_config %}
    {% set map_table = printer.print_task_config[map_table_key] %}
    {% if tool_index < 0 or tool_index >= map_table|length %}
      RESPOND MSG="Error: extruder_map_table out of range for index {tool_index} (size: {map_table|length})."
      return
    {% endif %}
    {% set extruder_index = map_table[tool_index]|int %}
    {% set spool_macro_name = 'T' ~ extruder_index %}
    RESPOND PREFIX="🧶" MSG="Tool {tool_index} -> physical extruder {extruder_index}."
  {% else %}
    {% set spool_macro_name = 'T' ~ tool_index %}
    RESPOND PREFIX="🧶" MSG="No extruder_map_table -- using T{tool_index} directly."
  {% endif %}

  {% set spool_macro_key = 'gcode_macro ' ~ spool_macro_name %}
  {% if spool_macro_key not in printer %}
    RESPOND PREFIX="🧶" MSG="Error: Spool macro {spool_macro_name} not found."
    return
  {% endif %}

  {% set spool_id_to_set = printer[spool_macro_key].spool_id %}

  {% if spool_id_to_set is defined and spool_id_to_set and spool_id_to_set != "None" %}
    SET_ACTIVE_SPOOL ID={spool_id_to_set}
    RESPOND PREFIX="🧶" MSG="Spoolman: spool {spool_id_to_set} active ({spool_macro_name})."
  {% else %}
    CLEAR_ACTIVE_SPOOL
    RESPOND PREFIX="🧶" MSG="No spool assigned to {spool_macro_name} -- active spool cleared."
  {% endif %}


# ---------------------------------------------------------------------------
# SET_ACTIVE_SPOOL / CLEAR_ACTIVE_SPOOL
# ---------------------------------------------------------------------------
# SET_ACTIVE_SPOOL notifies Moonraker which Spoolman spool is currently active
# and schedules a deferred save of all spool assignments.
#
# The UPDATE_DELAYED_GCODE call schedules SAVE_SELECTED_SPOOLS to run 10 ms
# after this call. If called multiple times in rapid succession (e.g. during a
# multi-toolchange sequence), UPDATE_DELAYED_GCODE *resets* the timer each
# time -- so the actual save runs exactly ONCE at the end of the sequence.
# This prevents redundant disk writes without losing persistence.
#
# IMPORTANT: omitting UPDATE_DELAYED_GCODE here means spool assignments are
# never written to variables.cfg and are lost on every Klipper restart.
# ---------------------------------------------------------------------------
[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID is defined %}
    {% set id = params.ID|int %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
    UPDATE_DELAYED_GCODE ID=SAVE_SELECTED_SPOOLS DURATION=0.01
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  RESPOND PREFIX="🧶" MSG="Active spool cleared"
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  UPDATE_DELAYED_GCODE ID=SAVE_SELECTED_SPOOLS DURATION=0.01


[gcode_macro CLEAR_ALL_SPOOLS]
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  RESPOND PREFIX="🧶" MSG="Clearing all spools"
  {% set tools = printer["gcode_macro _SPOOLMAN_CFG"].tools %}
  {% for tool in tools %}
    {% set macro = "gcode_macro " ~ tool %}
    {% if macro in printer and printer[macro].spool_id is defined %}
      SET_GCODE_VARIABLE MACRO={tool} VARIABLE=spool_id VALUE="None"
    {% endif %}
  {% endfor %}
  UPDATE_DELAYED_GCODE ID=SAVE_SELECTED_SPOOLS DURATION=1


# Saves all current spool assignments to variables.cfg.
# Triggered via UPDATE_DELAYED_GCODE -- never called directly.
#
# Uses VALUE="None" as sentinel for "no spool assigned".
# This avoids a SyntaxError in Snapmaker's Klipper build where
# ast.literal_eval only catches ValueError, not SyntaxError.
# An empty string VALUE="" causes SyntaxError -> Klipper shutdown
# (Error 0003-0522-0000-0002). "None" is a valid Python literal.
[delayed_gcode SAVE_SELECTED_SPOOLS]
gcode:
  {% set tools = printer["gcode_macro _SPOOLMAN_CFG"].tools %}
  {% for tool in tools %}
    {% set macro = "gcode_macro " ~ tool %}
    {% set vname = tool|lower ~ "__spool_id" %}
    {% if macro in printer and printer[macro].spool_id is defined %}
      {% set sid = printer[macro].spool_id|default("") %}
    {% else %}
      {% set sid = "" %}
    {% endif %}
    {% if sid != "" and sid != "None" %}
      SAVE_VARIABLE VARIABLE={vname} VALUE="{sid}"
    {% else %}
      SAVE_VARIABLE VARIABLE={vname} VALUE="None"
    {% endif %}
  {% endfor %}

[gcode_macro SAVE_CURRENT_SPOOLS]
gcode:
  RESPOND PREFIX="🧶" MSG="Current spools saved"
  UPDATE_DELAYED_GCODE ID=SAVE_SELECTED_SPOOLS DURATION=0.01


# Restores spool assignments from variables.cfg on Klipper startup.
[delayed_gcode RESTORE_SELECTED_SPOOLS]
initial_duration: 0.1
gcode:
  {% set svv = printer.save_variables.variables %}
  RESPOND PREFIX="🧶" MSG="Restoring spool assignments..."
  {% for object in printer %}
    {% if object.startswith('gcode_macro ') and printer[object].spool_id is defined %}
      {% set macro = object.replace('gcode_macro ', '') %}
      {% set var = (macro + '__SPOOL_ID')|lower %}
      {% if svv[var] is defined %}
        SET_GCODE_VARIABLE MACRO={macro} VARIABLE=spool_id VALUE={svv[var]}
      {% endif %}
    {% endif %}
  {% endfor %}


# ---------------------------------------------------------------------------
# Per-tool spool config (T0-T3)
# ---------------------------------------------------------------------------
# variable_spool_id stores the Spoolman spool ID for the *physical* slot.
# It is restored on startup by RESTORE_SELECTED_SPOOLS and persisted after
# each toolchange via the deferred SAVE_SELECTED_SPOOLS.
# ---------------------------------------------------------------------------
[gcode_macro T0]
rename_existing: T0.10001
variable_spool_id: None
gcode:
  SET_ACTIVE_SPOOL_MAPPED TOOL_INDEX=0
  T0.10001 {rawparams}

[gcode_macro T1]
rename_existing: T1.10001
variable_spool_id: None
gcode:
  SET_ACTIVE_SPOOL_MAPPED TOOL_INDEX=1
  T1.10001 {rawparams}

[gcode_macro T2]
rename_existing: T2.10001
variable_spool_id: None
gcode:
  SET_ACTIVE_SPOOL_MAPPED TOOL_INDEX=2
  T2.10001 {rawparams}

[gcode_macro T3]
rename_existing: T3.10001
variable_spool_id: None
gcode:
  SET_ACTIVE_SPOOL_MAPPED TOOL_INDEX=3
  T3.10001 {rawparams}
